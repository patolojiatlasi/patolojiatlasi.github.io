# English configuration
# Inherits common settings from _quarto_base.yml and _quarto_html_base.yml
# Only English-specific settings are defined here

metadata-files:
  - _quarto_base.yml
  - _quarto_html_base.yml
  - _quarto_chapters_EN.yml

project:
  output-dir: _EN
  resources:
    - "headerEN.html"
  pre-render:
    - ./R/prerender_EN.R
  post-render:
    - ./R/postrender_SEO.R

lang: en

book:
  title: "Histopathology Atlas"
  subtitle: "Atlas of Pathology with Whole Slide Images"
  author:
   - name: "Serdar Balcı"
     url: "https://www.serdarbalci.com"
     affiliation: "Memorial Pathology"
     affiliation-url: "https://patoloji.memorial.com.tr/"
     orcid: "0000-0002-7852-3851"
   - name: Pathologists, Assistants and Technicians
     affiliation: "Memorial Pathology & Other Institutions"
     affiliation-url: "https://www.histopathologyatlas.com/authors.html"
  description: |
    Atlas of Pathology with Whole Slide Images
    Histopathology Atlas and Notes for Medical Students
    Atlas of Histopathology
    Notes for Pathology
    Pathology Lecture Notes and Histopathology Atlas is being prepared from Memorial Pathology Archive and collaborators from other institutions.
  abstract: |
    Atlas of Pathology with Whole Slide Images
    Histopathology Atlas and Notes for Medical Students
    Pathology Lecture Notes and Histopathology Atlas is being prepared from Memorial Pathology Archive and collaborators from other institutions.
    If you want to contribute, please [contact us](https://www.histopathologyatlas.com/contributions.html).
  image: images/coverEN.png
  output-file: "HistoPatology-Atlas"
  cover-image: images/coverEN.png
  cover-image-alt: "Histopathology Atlas book cover"
  site-url: https://www.histopathologyatlas.com/
  sidebar:
    style: floating
  open-graph:
    image: https://www.histopathologyatlas.com/images/coverEN.png
  page-footer:
    left: "Copyright 2022, patolojiAI"

  # Chapters and appendices are defined in the imported chapter list.

format:
  html:
    cover-image: images/coverEN.png
    include-in-header:
      - file: "./headerEN.html"

citation:
    type: webpage
    container-title: Histopathology Atlas Atlas of Pathology with Whole Slide Images
    url: "https://www.histopathologyatlas.com/"
