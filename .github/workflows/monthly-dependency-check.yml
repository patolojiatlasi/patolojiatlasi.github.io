name: Monthly dependency check

on:
  pull_request:
    paths:
      - '.github/workflows/monthly-release.yml'
      - '.github/workflows/monthly-dependency-check.yml'
      - 'DESCRIPTION'
      - 'R/**'
      - '_quarto*.yml'
      - 'chapter-mappings.yml'
      - 'tests/**'
      - 'yonetim-gelistirme.qmd'
      - 'images/document-assets/**'
      - 'tukuruk.qmd'
      - 'hucre-ici-birikimler.qmd'
      - 'meningiom.qmd'
      - 'qrcodes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: ~/.local/share/R/library
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - name: Install document system dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin libcurl4-openssl-dev libuv1-dev
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract the monthly dependency step (no release code)
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path(".github/workflows/monthly-release.yml").read_text())
          steps = workflow["jobs"]["monthly-release"]["steps"]
          matches = [s for s in steps if s.get("name") == "Install R dependencies"]
          assert len(matches) == 1
          step = matches[0]
          assert step["shell"] == "Rscript {0}"
          script = step["run"]
          assert script.splitlines()[0] == 'options(repos = c(CRAN = "https://cloud.r-project.org"))'
          Path(os.environ["RUNNER_TEMP"], "monthly-dependencies.R").write_text(script)
          PY
      # Deliberately start without the monthly cache to exercise remotes bootstrap.
      # Only the extracted R block executes here; no tags or uploads.
      - name: Install monthly dependencies from a cold library
        run: Rscript "$RUNNER_TEMP/monthly-dependencies.R"
      - name: Verify installed dependencies and native linkage
        shell: Rscript {0}
        run: |
          deps <- remotes::dev_package_deps(dependencies = TRUE)
          required <- unique(c(deps$package, "remotes", "fs", "quarto", "xfun", "readxl", "tinytex"))
          missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) stop("Unavailable dependencies: ", paste(missing, collapse = ", "))
          stopifnot(tinytex::is_tinytex())
          library(stringi)
          print(stringi::stri_info())
          print(sessionInfo())

      - name: Generate document chapter configurations
        run: Rscript R/generate-chapter-yamls.R
      - name: Check QR assets, decoded destinations, and EPUB/Word configuration
        run: |
          python -m pip install -r tests/document-assets-requirements.txt
          python tests/document-assets.py
      - name: Check management media rendering in HTML and PDF
        run: python tests/document-badges.py
      - name: Test all document chapter configurations and generated QMDs
        run: Rscript tests/document-chapters.R
      # Attempt every wrapper even if another language/format fails.
      # Each wrapper cleans generated QMDs on error; no release/deployment code.
      - name: Check all four document renders without publishing
        shell: bash
        run: |
          failed=0
          for format in epub_word_TR pdf_TR epub_word_EN pdf_EN; do
            if Rscript "R/render_${format}.R" > "${RUNNER_TEMP}/render-${format}.log" 2>&1; then
              echo "${format}: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "${format}: FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
              tail -n 60 "${RUNNER_TEMP}/render-${format}.log"
              if test -f index.tex; then
                cp index.tex "${RUNNER_TEMP}/render-${format}.tex"
                grep -n -B 4 -A 4 -E "mediabag/badge|includesvg|mediabag/.*webp" index.tex || true
              fi
              failed=1
            fi
          done
          # Verify the six deliverables, not just the wrapper exit codes.
          for output in \
            _epub_word_TR/Patoloji-Atlasi.epub \
            _epub_word_TR/Patoloji-Atlasi.docx \
            _pdf_TR/Patoloji-Atlasi.pdf \
            _epub_word_EN/HistoPatology-Atlas.epub \
            _epub_word_EN/HistoPatology-Atlas.docx \
            _pdf_EN/HistoPathology-Atlas.pdf; do
            if test -s "$output"; then
              echo "$output: GENERATED ($(stat -c%s "$output") bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$output: MISSING" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve document check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-document-check-logs
          path: |
            ${{ runner.temp }}/render-*.log
            ${{ runner.temp }}/render-*.tex
          if-no-files-found: ignore
